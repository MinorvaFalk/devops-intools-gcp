name: devops-intools

services:
  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  db:
    image: ${REGISTRY:-docker.io}/postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-devtools}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devtools}
      POSTGRES_DB: ${POSTGRES_DB:-devtools}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-devtools} -d ${POSTGRES_DB:-devtools}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend

  # ── Migrations (run once, then exit) ───────────────────────────────────────
  migrate:
    build:
      context: ./devops-intools-api
      target: migrate
    command: ["up"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-devtools}:${POSTGRES_PASSWORD:-devtools}@db:5432/${POSTGRES_DB:-devtools}?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend

  # ── API ─────────────────────────────────────────────────────────────────────
  api:
    build:
      context: ./devops-intools-api
      target: server
    restart: unless-stopped
    environment:
      PORT: 8080
      DATABASE_URL: postgres://${POSTGRES_USER:-devtools}:${POSTGRES_PASSWORD:-devtools}@db:5432/${POSTGRES_DB:-devtools}?sslmode=disable
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/gcp-sa.json
      API_KEY: ${API_KEY:-}
      ENABLE_IAP: ${ENABLE_IAP:-false}
      IAP_AUDIENCE: ${IAP_AUDIENCE:-}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      PROJECT_REF_URL: ${PROJECT_REF_URL:-}
      PROJECT_REF_SKIP_TLS_VERIFY: ${PROJECT_REF_SKIP_TLS_VERIFY:-false}
    volumes:
      - ${GCP_CREDENTIALS_FILE:?GCP_CREDENTIALS_FILE must be set}:/run/secrets/gcp-sa.json:ro
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - backend

  # ── Frontend (nginx + React SPA) ────────────────────────────────────────────
  app:
    build:
      context: ./devops-intools-app
      args:
        VITE_API_BASE_URL: /api/v1
        VITE_CACHE_TTL_MS: ${VITE_CACHE_TTL_MS:-300000}
        VITE_API_KEY: ${VITE_API_KEY:-}
        VITE_FIREWALL_PROJECTS: ${VITE_FIREWALL_PROJECTS:-}
    restart: unless-stopped
    environment:
      API_BACKEND_URL: http://api:8080
    ports:
      - "${APP_PORT:-3000}:80"
    depends_on:
      - api
    networks:
      - backend

networks:
  backend:

volumes:
  postgres_data:
