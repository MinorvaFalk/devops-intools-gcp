name: devops-intools

# Production overrides.
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Build and push images first:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml build
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml push

services:
  db:
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 512m
        reservations:
          memory: 256m

  migrate:
    image: ${REGISTRY:-docker.io}/${IMAGE_NS:-devops-intools}/api:${TAG:-latest}
    build:
      cache_from:
        - ${REGISTRY:-docker.io}/${IMAGE_NS:-devops-intools}/api:${TAG:-latest}
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  api:
    image: ${REGISTRY:-docker.io}/${IMAGE_NS:-devops-intools}/api:${TAG:-latest}
    build:
      cache_from:
        - ${REGISTRY:-docker.io}/${IMAGE_NS:-devops-intools}/api:${TAG:-latest}
    restart: always
    environment:
      LOG_FORMAT: json
      LOG_LEVEL: ${LOG_LEVEL:-info}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 256m
        reservations:
          memory: 128m

  app:
    image: ${REGISTRY:-docker.io}/${IMAGE_NS:-devops-intools}/app:${TAG:-latest}
    build:
      cache_from:
        - ${REGISTRY:-docker.io}/${IMAGE_NS:-devops-intools}/app:${TAG:-latest}
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 128m
        reservations:
          memory: 64m
